name: Build Android (.apk / .aab)

# Run it from the GitHub "Actions" tab → "Build Android" → "Run workflow".
# Builds with `eas build --local` on GitHub's free Ubuntu runner (no EAS build
# credits used) and publishes the result on the repository's Releases page.
#
# Pick a profile when you run it:
#   • preview    → installable .apk to send to the pilot batch's parents and
#                  the staff's phones (default — start here)
#   • production → signed .aab for the Play Store
#
# Both builds talk to https://bio.fiveminfotech.com
# (eas.json). Needs the repository secret EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - preview
          - production
        default: preview

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # needed to publish the build as a GitHub Release asset
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (remove preinstalled tools we don't need)
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -a -f || true
          echo "Disk after:"; df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Raise Gradle memory
        # written to the GLOBAL Gradle home so it survives `expo prebuild`
        # regenerating android/gradle.properties during `eas build --local`
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Cache Gradle (reuse compiled native libraries across runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'app.json', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      # puts sdkmanager on PATH and accepts the licences; Gradle downloads the
      # exact platform, build tools and NDK this Expo SDK asks for
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pick output extension for the profile
        id: out
        run: |
          if [ "${{ inputs.profile }}" = "preview" ]; then
            echo "ext=apk" >> "$GITHUB_OUTPUT"
          else
            echo "ext=aab" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (local — free, no EAS credits)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --output "${{ github.workspace }}/akbars-academy.${{ steps.out.outputs.ext }}"

      # `blockedPermissions` in app.json only marks the SOURCE manifest; the
      # manifest merger drops the entry during the build. So the one place to
      # check the result is the artifact about to be shipped. A stray
      # microphone or location permission on a children's attendance app means
      # Play review questions and a Data safety declaration nobody wants.
      - name: Verify no blocked permission survived the merge
        run: |
          BT=1.17.2
          curl -sL -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BT/bundletool-all-$BT.jar"
          ART="akbars-academy.${{ steps.out.outputs.ext }}"
          if [ "${{ steps.out.outputs.ext }}" = "aab" ]; then
            java -jar /tmp/bundletool.jar dump manifest --bundle="$ART" > /tmp/manifest.xml
          else
            AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
            "$AAPT2" dump xmltree "$ART" --file AndroidManifest.xml > /tmp/manifest.xml
          fi

          echo "--- permissions in the shipped manifest ---"
          grep -oE 'android\.permission\.[A-Z_]+' /tmp/manifest.xml | sort -u

          BLOCKED="RECORD_AUDIO SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION"
          FOUND=""
          for p in $BLOCKED; do
            grep -qE "android\.permission\.$p\b" /tmp/manifest.xml && FOUND="$FOUND $p"
          done
          if [ -n "$FOUND" ]; then
            echo "::error::Blocked permission(s) still present:$FOUND"
            exit 1
          fi
          echo "OK — none of the blocked permissions are in the build."

      # a GitHub RELEASE, not an artifact: release assets do not count against
      # the 500 MB Actions artifact quota
      - name: Publish build to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$TAG" \
            "akbars-academy.${{ steps.out.outputs.ext }}" \
            --title "Android ${{ inputs.profile }} build #${{ github.run_number }}" \
            --notes "Automated \`eas build --local\` output. Download the .${{ steps.out.outputs.ext }} file below. API: https://bio.fiveminfotech.com" \
            --prerelease
